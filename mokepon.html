<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOKEPON!</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap');

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Fredoka';
            background-color: #3B38A0;
            color: white;
        }
        main {
            display: flex;
            justify-content: center;
            
        }
        .titulo {            
            font-size: 32px;
            margin-block: 24px;
        }

        .subtitulo {
            font-size: 20px;
            margin-block-end: 16px;
        }
        #elegir-mascota {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: auto;
            width: 80%;
            background-color: #B2B0E8;
            margin-block-start: 32px;
            border-radius: 8px;
            padding: 10px;
            max-width: 900px;
        }
        .tarjetas {
            display: flex;
            gap: 10px;
            /* background-color: red; */
        }

        .tarjetas label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 180px;
            height: 100px;
            box-sizing: border-box;
            border-radius: 12px;
            padding: 10px;
            background-color: #7A85C1;
            transition: all ease .3s;
        }

        .tarjetas input:checked + label{
            background-color: #3b38a0;
            
            & p{
                opacity: 1;
            }
            & img {
                opacity: .2;
            }
        }

        .tarjetas label p{
            opacity: 0;
            font-size: 1.2em;
            font-weight: bold;
            
        }
        .tarjetas label:hover {
            cursor: pointer;
            background-color: #3b38a0;

        }
        .tarjetas label:hover p{
            opacity: 1;
        }
        .tarjetas label:hover img{
            opacity: .2;
        }

        .tarjetas img{
            width: 80px;
            margin-left: -70px;
            
        }
        #elegir-mascota button{
            width: 40%;
            margin-block: 16px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: #3B38A0;
            color: white;
            font-weight: bold;
            transition: background-color ease .5s;
        }

        #elegir-mascota button:hover{
            cursor: pointer;
            background-color: #7A85C1;
            
        }

        input {
            display: none;
        }
         
        
        
    </style>

    <script src="./js/mokepon.js" defer></script>
</head>
<body>
    <header>
    </header>   
    <main class="main">           
        <section id="elegir-mascota">
            <h1 class="titulo">Mokepon</h1>
            
            <h2 class="subtitulo">Elige tu mascota:</h2>
            
            <div class="tarjetas">
                <input type="radio" name="mascota" id="hipodoge">
                <label for="hipodoge">
                    <p>Hipodoge</p>
                    <img src="./assets/mokepons_mokepon_hipodoge_attack.png" alt="hipodoge">
                </label>
            
                <input type="radio" name="mascota" id="capipepo">
                <label for="capipepo">
                    <p>Capipepo</p>
                    <img src="./assets/mokepons_mokepon_capipepo_attack.png" alt="capipepo">
                </label>
                
    
                <input type="radio" name="mascota" id="ratigueya">
                <label for="ratigueya">
                    <p>Ratigueya</p>
                    <img src="./assets/mokepons_mokepon_ratigueya_attack.webp" alt="ratigueyas">
                </label>
                
                
                <!-- <label for="langostelvis">langostelvis</label>
                
                
                <label for="tucapalma">tucapalma</label>
                
                
                <label for="pydos">pydos</label> -->
                
            </div>

            <button id="btn-mascota">Seleccionar</button>
        </section>

        <section id="seleccionar-ataque">
            <h2>Elige tu ataque:</h2>
            <p>Tu mascota <span id="mascota-jugador"></span> tiene <span id="vidas-mascota-jugador">3</span> vidas</p>
            <p>La mascota del enemigo <span id="mascota-enemigo"></span> tieene <span id="vidas-mascota-enemigo">3</span> vidas</p>

            <p>
                <button class="btn-fuego">Fuego 🔥</button>
                <button class="btn-agua">Agua 💧</button>
                <button class="btn-tierra">Tierra ☘</button>
            </p>
        </section>

        <section id="mensajes">
            <!-- <p>Tu mascota atacó con FUEGO, la mascota del enemigo atacó con TIERRA - GANASTE 🎉</p> -->
        </section>

        <section id="reiniciar">
            <button id="btn-reiniciar" disabled>Reiniciar</button>
        </section>
    </main>
    <!-- <footer>
        <h2>FOOTER</h2>
    </footer> -->
</body>
</html>
