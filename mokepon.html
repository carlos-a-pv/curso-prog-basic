<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOKEPON!</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <script src="./js/mokepon.js" defer></script>
</head>
<body>
    <header>
    </header>   
    <h1 class="titulo">Mokepon</h1>
    <main class="main">           
        <section id="elegir-mascota">
            
            <h2 class="subtitulo">Elige tu mascota:</h2>
            
            <div class="tarjetas">
                <input type="radio" name="mascota" id="hipodoge">
                <label for="hipodoge">
                    <p>Hipodoge</p>
                    <img src="./assets/mokepons_mokepon_hipodoge_attack.png" alt="hipodoge">
                </label>
            
                <input type="radio" name="mascota" id="capipepo">
                <label for="capipepo">
                    <p>Capipepo</p>
                    <img src="./assets/mokepons_mokepon_capipepo_attack.png" alt="capipepo">
                </label>
                
    
                <input type="radio" name="mascota" id="ratigueya">
                <label for="ratigueya">
                    <p>Ratigueya</p>
                    <img src="./assets/mokepons_mokepon_ratigueya_attack.webp" alt="ratigueyas">
                </label>
                
                
                <!-- <label for="langostelvis">langostelvis</label>
                
                
                <label for="tucapalma">tucapalma</label>
                
                
                <label for="pydos">pydos</label> -->
                
            </div>

            <button id="btn-mascota">Seleccionar</button>
        </section>

        <section id="seleccionar-ataque">
            <h2 class="subtitulo">Elige tu ataque:</h2>
            
            <div class="container-buttons">
                <button class="btn-fuego">Fuego 🔥</button>
                <button class="btn-agua">Agua 💧</button>
                <button class="btn-tierra">Tierra ☘</button>
            </div>
            <div class="container-messages">
                <div id="mensajes">
                </div>
                <div id="reiniciar">
                    <button disabled id="btn-reiniciar" disabled>Reiniciar</button>
                </div>
            </div>    
        </section>
        <section class="marcadores" id="marcadores">
            <div>
                <p id="vidas-mascota-jugador">3</p>
                <p id="mascota-jugador"></p>
            </div>

            <div>
                <p id="vidas-mascota-enemigo">3</p>
                <p id="mascota-enemigo"></p>
                <!-- <p>La mascota del enemigo <span id="mascota-enemigo"></span> tieene <span id="vidas-mascota-enemigo">3</span> vidas</p> -->
            </div>
        </section >

        

    </main>
    <!-- <footer>
        <h2>FOOTER</h2>
    </footer> -->
</body>
</html>
